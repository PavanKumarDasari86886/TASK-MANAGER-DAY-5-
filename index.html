<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>TaskFlow</h2>
            </div>

            <nav>
                <ul>
                    <li class="active">🏠 Dashboard</li>
                    <li>📋 All Tasks</li>
                    <li>✅ Completed</li>
                    <li>⏳ Pending</li>
                    <li>⭐ High Priority</li>
                    <li>⚙ Settings</li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header>
                <div>
                    <h1>Dynamic Task Manager</h1>
                    <p>Organize your work beautifully ✨</p>
                </div>
                <button id="addTaskBtn">+ New Task</button>
            </header>

            <!-- Stats -->
            <section class="stats">
                <div class="stat-card total">
                    <h2 id="totalTasks">0</h2>
                    <p>Total Tasks</p>
                </div>

                <div class="stat-card completed">
                    <h2 id="completedTasks">0</h2>
                    <p>Completed</p>
                </div>

                <div class="stat-card pending">
                    <h2 id="pendingTasks">0</h2>
                    <p>Pending</p>
                </div>
            </section>

            <!-- Search + Filter -->
            <section class="controls">
                <input type="text" id="searchTask" placeholder="🔍 Search tasks...">

                <select id="filterTasks">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                    <option value="high">High Priority</option>
                </select>
            </section>

            <!-- Task List -->
            <section class="task-section">
                <div id="taskList"></div>
            </section>

        </main>
    </div>

    <!-- Task Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <span class="closeBtn">&times;</span>

            <h2>Create New Task</h2>

            <input type="text" id="taskTitle" placeholder="Task Title">
            <textarea id="taskDescription" placeholder="Task Description"></textarea>

            <select id="taskPriority">
                <option value="Low">🟢 Low Priority</option>
                <option value="Medium">🟡 Medium Priority</option>
                <option value="High">🔴 High Priority</option>
            </select>

            <input type="date" id="taskDate">

            <button id="saveTask">Save Task</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
