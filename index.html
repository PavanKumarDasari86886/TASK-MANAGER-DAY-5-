<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Task Manager</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow"></div>

    <!-- Header -->
    <header class="header neon-box">
        <h1>Task Manager</h1>
        <p>Organize your work and stay productive</p>
    </header>

    <!-- Main Container -->
    <main class="container">

        <!-- Add Task -->
        <section class="task-form-section neon-box">
            <h2>Add New Task</h2>

            <form id="taskForm" class="task-form">
                <input type="text" id="taskInput" placeholder="Enter task name" required>

                <select id="category">
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Study">Study</option>
                    <option value="Fitness">Fitness</option>
                </select>

                <select id="priority">
                    <option value="High">High Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>

                <input type="date" id="dueDate" required>

                <button type="submit">Add Task</button>
            </form>
        </section>

        <!-- Controls -->
        <section class="controls neon-box">
            <input type="text" id="searchTask" placeholder="Search tasks">

            <select id="filterTasks">
                <option value="all">All Tasks</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
            </select>

            <button id="clearAll">Clear All</button>
        </section>

        <!-- Stats -->
        <section class="stats">
            <div class="stat-card neon-blue">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="stat-card neon-green">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="stat-card neon-orange">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>
        </section>

        <!-- Task List -->
        <section class="task-list-section neon-box">
            <h2>Your Tasks</h2>
            <div id="taskList" class="task-list"></div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer neon-box">
        <p>Responsive Task Manager © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
